<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Spotify Mainstream</title>
</head>

<body>

    <button id="btn-login">Conectar con Spotify</button>
    <button id="btn-logout">Desconectar Spotify</button>

    <script type="module">
        import { login, logout } from './js/auth.js';
        import { getTopArtist, getTopTracks } from './js/api.js';
        import {calcularMainstream} from "./js/analysis.js";

        document.getElementById('btn-login').addEventListener('click', login);
        document.getElementById('btn-logout').addEventListener('click', logout);

        const artistas = await getTopArtist();
        const canciones = await getTopTracks();

        const resultado = calcularMainstream(artistas, canciones);

        console.log('Índice:', resultado.indice);
        console.log('Nivel:', resultado.nivel);
    </script>

</body>

</html>
