<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Spotify Mainstream</title>
</head>

<body>

    <button id="btn-login">Conectar con Spotify</button>
    <button id="btn-logout">Desconectar Spotify</button>

    <script type="module">
        import { login, logout } from './js/auth.js';
        import { getTopArtist, getTopTracks } from './js/api.js';
        import { calcularMainstream } from "./js/analysis.js";

        let mensajeArtistas = ""
        let mensajeCanciones = ""
        const artistas = await getTopArtist();
        const canciones = await getTopTracks();

        document.getElementById('btn-login').addEventListener('click', login);
        document.getElementById('btn-logout').addEventListener('click', logout);





        for (const artista of artistas.items) {
            mensajeArtistas += artista.name + " | "
        }


        for (const cancion of canciones.items) {


            mensajeCanciones += cancion.name + " - ";

            for (let index = 0; index < cancion.artists.length; index++) {
                mensajeCanciones += cancion.artists[index].name + " - "
                
            }

            mensajeCanciones += " | "
        }


        console.log(canciones.items)
        console.log('Artistas:', mensajeArtistas);
        console.log('Canciones:', mensajeCanciones);




    </script>

</body>

</html>
