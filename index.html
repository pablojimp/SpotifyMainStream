<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>¿Como de MainStream Eres?</title>
</head>

<body>

    <div id="pantalla-login" class="container">
        <h1>¿Qué tan mainstream eres?</h1>
        <p>Conecta tu Spotify y descúbrelo</p>
        <button id="btn-login">Conectar con Spotify</button>
    </div>

    <style>
        /* From Uiverse.io by SelfMadeSystem */
        /*
More comprehensive version at shenanigans.shoghisimon.ca/collection/css-blur-blob-bg/
 */

        .container::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            backdrop-filter: hue-rotate(90deg);
            mask: linear-gradient(45deg, #0000, #000);
            animation: rotaty 5s linear infinite;
            transform-origin: center;
        }

        .container {
            position: absolute;
            background-image: radial-gradient(circle at 50% 50%,
                    #0000 0,
                    #0000 2px,
                    hsl(0 0 4%) 2px);
            background-size: 8px 8px;
            width: 100%;
            height: 100%;
        }

        @keyframes thingy {
            0% {
                filter: var(--f) hue-rotate(0deg);
            }

            to {
                filter: var(--f) hue-rotate(1turn);
            }
        }

        .container::before {
            content: "";
            position: absolute;
            inset: -8em;
            z-index: -1;
            --f: blur(7em) brightness(5);
            --c: #09f;
            animation:
                blobs-1e28bd3d 150s linear infinite,
                thingy 5s linear infinite;
            background-color: #000;
            background-image: radial-gradient(ellipse 66px 50px at 50% 50%,
                    #0f0 0%,
                    transparent 100%),
                radial-gradient(ellipse 77px 60px at 50% 50%, #0f0 0%, transparent 100%),
                radial-gradient(ellipse 78px 100px at 50% 50%, #0f0 0%, transparent 100%),
                radial-gradient(ellipse 73px 96px at 50% 50%, #0f0 0%, transparent 100%),
                radial-gradient(ellipse 76px 77px at 50% 50%, #0f0 0%, transparent 100%),
                radial-gradient(ellipse 66px 51px at 50% 50%, #0f0 0%, transparent 100%),
                radial-gradient(ellipse 90px 57px at 50% 50%, #0f0 0%, transparent 100%),
                radial-gradient(ellipse 89px 93px at 50% 50%, #0f0 0%, transparent 100%);
            background-size:
                726px 576px,
                1242px 454px,
                876px 1160px,
                691px 873px,
                914px 550px,
                1159px 340px,
                1017px 831px,
                313px 977px;
        }

        @keyframes blobs-1e28bd3d {
            0% {
                background-position:
                    271px 478px,
                    62px 291px,
                    67px 861px,
                    553px 413px,
                    36px 392px,
                    1077px 226px,
                    400px 799px,
                    7px 264px;
            }

            to {
                background-position:
                    -14975px -2978px,
                    31112px 11187px,
                    -20081px 8981px,
                    11609px -3952px,
                    -12760px 12492px,
                    -9354px 2946px,
                    9553px 21574px,
                    946px 9057px;
            }
        }
    </style>


    <div id="pantalla-app" style="display:none">
        <button id="btn-logout">Cerrar sesión</button>

        <h2>Tus Top 5 Artistas</h2>
        <div id="lista-artistas"></div>

        <h2>Tus Top 5 Canciones</h2>
        <div id="lista-canciones"></div>

        <h2>Tu índice mainstream</h2>
        <div id="resultado"></div>
    </div>

    <script type="module">
        import { login, logout, getToken } from './js/auth.js';
        import { getTopArtist, getTopTracks } from './js/api.js';
        import { calcularMainstream } from './js/analysis.js';

        document.getElementById('btn-login').addEventListener('click', login);
        document.getElementById('btn-logout').addEventListener('click', logout);

        const token = await getToken();

        if (!token) {
            // Sin sesión: mostramos solo el login
            document.getElementById('pantalla-login').style.display = 'block';
        } else {
            // Con sesión: ocultamos login y cargamos datos
            document.getElementById('pantalla-login').style.display = 'none';
            document.getElementById('pantalla-app').style.display = 'block';
            cargarDatos();
        }

        async function cargarDatos() {
            const artistas = await getTopArtist();
            const canciones = await getTopTracks();
            const resultado = calcularMainstream(canciones);

            // Top 5 artistas
            const contenedorArtistas = document.getElementById('lista-artistas');
            artistas.items.slice(0, 5).forEach((artista, index) => {
                const div = document.createElement('div');
                div.textContent = `#${index + 1} ${artista.name}`;
                contenedorArtistas.appendChild(div);
            });

            // Top 5 canciones
            const contenedorCanciones = document.getElementById('lista-canciones');
            canciones.items.slice(0, 5).forEach((cancion, index) => {
                const div = document.createElement('div');
                div.textContent = `#${index + 1} ${cancion.name} - ${cancion.artists[0].name}`;
                contenedorCanciones.appendChild(div);
            });

            // Resultado mainstream
            document.getElementById('resultado').textContent =
                `Índice: ${Math.round(resultado.indice)} — ${resultado.nivel}`;
        }

    </script>
</body>

</html>
