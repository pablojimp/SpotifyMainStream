<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Spotify Mainstream</title>
</head>

<body>

    <script type="module">
        import { login, logout } from './js/auth.js';
        import { getTopArtist, getTopTracks, getTop50Artist } from './js/api.js';

        document.getElementById('btn-login').addEventListener('click', login);
        document.getElementById('btn-logout').addEventListener('click', logout);

        // prueba temporal
        const artistas = await getTopArtist();
        const canciones = await getTopTracks();
        const global = await getTop50Artist();

        console.log('Artistas:', artistas);
        console.log('Canciones:', canciones);
        console.log('Global:', global);
    </script>
</body>

</html>
